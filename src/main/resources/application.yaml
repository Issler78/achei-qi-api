server:
  port: 8090
spring:
  application:
    name: acheiQI
  datasource:
    url: jdbc:postgresql://localhost:5432/acheiqi
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
jwt:
  key: ${JWT_SECRET}
